[workspace]
channels = ["conda-forge", "bioconda", "https://repo.prefix.dev/almost-conductor"]
name = "metrics"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.1"

[tasks]
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/metrics.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/metrics.yml"

[dependencies]
# Python
python = ">=3.12,<3.14"  # numba (scib-metrics -> pynndescent/umap-learn) has no cp314 wheels yet
scikit-learn = "*"
numpy = "<2.5"  # numba (scib-metrics -> pynndescent/umap-learn) has no numpy>=2.5 support yet
polars = "*"
h5py = "*"
pyyaml = "*"
# R
r-base = ">=4.5"
r-argparser = "*"
r-jsonlite = "*"
"r-data.table" = "*"
bioconductor-biocversion = "3.22.*"
bioconductor-poem = "*"
bioconductor-cellmixs = "*"
bioconductor-rhdf5 = "*"
r-yaml = "*"
r-mlmetrics = "*"

[pypi-dependencies]
# not on conda-forge/bioconda (checked via anaconda.org); pip-resolves its own
# jax/jaxlib/scanpy/anndata/pynndescent transitive deps.
scib-metrics = "*"

[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[environments]
dev = { features = ["dev"], no-default-feature = true }