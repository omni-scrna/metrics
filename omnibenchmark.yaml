# OmniBenchmark Module Configuration

entrypoints:
  normalization-r: normalization/normalization.R
  embedding-py: embedding/embedding.py
  embedding-r: embedding/embedding.R
  graph-r: graph/graph.R
  cluster-r: cluster/cluster.R
  annotation-r: annotation/annotation.R
  integration-r: integration/integration.R
  integration-py: integration/integration.py

templates:
  repo: https://github.com/omni-scrna/boilerplate
  ref: main # the engine lives on boilerplate main
  lang: r

# Benchmark(s) that this module plugs into; `sync` vendors each one's schema/ dir into
# src/common/schema/. Tracking the unmerged contract branch for now.
benchmarks:
  - name: split-stages
    repo: https://github.com/omni-scrna/split-stages-plan
    plan: benchmark_conda.yaml
    ref: embed-gen
